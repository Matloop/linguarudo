<!doctype html>
<html lang="pt-BR" class="tema-claro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Linguetta · protótipo da interface</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-41 -32 300 300'%3E%3Crect x='-41' y='-32' width='300' height='300' rx='64' fill='%2311261a'/%3E%3Cg fill='%23f7f1e6'%3E%3Cpath d='M0 0H31V130A36 36 0 0 0 67 166H133L125.25 197H67A67 67 0 0 1 0 130Z'/%3E%3Cpath d='M70 30H117A67 67 0 0 1 184 97L152.1 89A36 36 0 0 0 117 61H76L57 43.5C52.5 39 55 30 70 30Z'/%3E%3Cpath d='M73.2 155A67 67 0 0 1 139 100.5H150A67 67 0 0 1 217 167.5A67 67 0 0 1 150 234.5H126.25L134 203.5H150A36 36 0 0 0 186 167.5A36 36 0 0 0 150 131.5H139A36 36 0 0 0 105.2 155Z'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root {
	--f-head: "Manrope", "Inter", system-ui, sans-serif;
	--f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
	--verde: #11261a;
	--verde-2: #1d3b2a;
	--salvia: #8aa392;
	--verde-claro: #dfe6dc;
	--creme: #f7f1e6;
	--terra: #a8613f;
	--ease: cubic-bezier(0.22, 0.8, 0.24, 1);
	--ease-in: cubic-bezier(0.5, 0, 0.75, 0);
	--tab-h: 64px;
	--safe-b: env(safe-area-inset-bottom, 0px);
	--safe-t: env(safe-area-inset-top, 0px);
	--r-s: 6px;
	--r-m: 8px;
	--r-l: 12px;
}
.tema-claro {
	color-scheme: light;
	--page: #f1ebdf;
	--panel: #fbf8f2;
	--raise: #ffffff;
	--tile: #f6f2ea;
	--sunk: #efe9de;
	--hover: rgba(17, 38, 26, 0.04);
	--press: rgba(17, 38, 26, 0.07);
	--sel: rgba(17, 38, 26, 0.05);
	--line: rgba(17, 38, 26, 0.08);
	--line-2: rgba(17, 38, 26, 0.14);
	--ink: #16231b;
	--ink-2: #545c55;
	--ink-3: #8a8d84;
	--primary: #1a3626;
	--primary-hover: #11261a;
	--on-primary: #f7f1e6;
	--accent-ink: #1a3626;
	--nav-active: #ffffff;
	--prog: #1a3626;
	--prog-track: rgba(17, 38, 26, 0.09);
	--terra-ink: #9a5536;
	--terra-soft: rgba(168, 97, 63, 0.1);
	--hl: #e3e8dd;
	--hl-ink: #11261a;
	--ring: rgba(26, 54, 38, 0.28);
	--scrim: rgba(17, 30, 22, 0.18);
	--mark-soft: rgba(17, 38, 26, 0.1);
	--sh-panel: 0 0 0 1px rgba(17, 38, 26, 0.05), 0 1px 2px rgba(17, 38, 26, 0.03);
	--sh-card: 0 0 0 1px rgba(17, 38, 26, 0.07), 0 1px 1px rgba(17, 38, 26, 0.03);
	--sh-lift: 0 0 0 1px rgba(17, 38, 26, 0.07), 0 4px 14px -8px rgba(17, 38, 26, 0.16);
	--sh-pop: 0 0 0 1px rgba(17, 38, 26, 0.08), 0 12px 32px -14px rgba(17, 30, 22, 0.24);
	--art-1: #ece6da;
}
.tema-escuro {
	color-scheme: dark;
	--page: #0d1f15;
	--panel: #12281c;
	--raise: #173022;
	--tile: rgba(247, 241, 230, 0.035);
	--sunk: rgba(0, 0, 0, 0.16);
	--hover: rgba(247, 241, 230, 0.045);
	--press: rgba(247, 241, 230, 0.075);
	--sel: rgba(247, 241, 230, 0.06);
	--line: rgba(247, 241, 230, 0.08);
	--line-2: rgba(247, 241, 230, 0.14);
	--ink: #f3ede1;
	--ink-2: #b9c0b6;
	--ink-3: #87938a;
	--primary: #f3ede1;
	--primary-hover: #ffffff;
	--on-primary: #11261a;
	--accent-ink: #f3ede1;
	--nav-active: rgba(247, 241, 230, 0.07);
	--prog: #e9e2d3;
	--prog-track: rgba(247, 241, 230, 0.1);
	--terra-ink: #d79b7b;
	--terra-soft: rgba(215, 155, 123, 0.12);
	--hl: rgba(138, 163, 146, 0.24);
	--hl-ink: #f3ede1;
	--ring: rgba(243, 237, 225, 0.35);
	--scrim: rgba(0, 8, 4, 0.5);
	--mark-soft: rgba(247, 241, 230, 0.09);
	--sh-panel: 0 0 0 1px rgba(247, 241, 230, 0.05);
	--sh-card: 0 0 0 1px rgba(247, 241, 230, 0.07);
	--sh-lift: 0 0 0 1px rgba(247, 241, 230, 0.08), 0 8px 20px -12px rgba(0, 0, 0, 0.6);
	--sh-pop: 0 0 0 1px rgba(247, 241, 230, 0.1), 0 16px 40px -16px rgba(0, 0, 0, 0.7);
	--art-1: #1a3426;
}

/* ───────────────────────── base ───────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
	background: var(--page);
	color: var(--ink);
	font: 400 14.5px/1.5 var(--f-body);
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
	font-feature-settings: "cv11", "ss01";
	transition: background-color 0.35s var(--ease), color 0.35s var(--ease);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--r-s); }
::selection { background: var(--hl); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 15px; height: 15px; }
.ic.lg { width: 22px; height: 22px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
kbd {
	display: inline-grid; place-items: center;
	min-width: 20px; height: 20px; padding: 0 5px;
	font: 500 11px/1 var(--f-body);
	color: var(--ink-3);
	background: var(--sunk);
	border-radius: 4px;
	box-shadow: inset 0 0 0 1px var(--line);
}
mark { background: var(--hl); color: var(--hl-ink); border-radius: 3px; padding: 0 3px; margin: 0 -1px; font-weight: 500; }

/* ───────────────────────── marca ───────────────────────── */
.mark { display: block; flex: none; height: 22px; width: auto; aspect-ratio: 218 / 236; fill: currentColor; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); }
.brand .wordmark { font: 600 17px/1 var(--f-head); letter-spacing: -0.012em; translate: 0 -1px; }
.mark-hero { height: 76px; color: var(--mark-soft); margin: 0 auto 28px; }

/* ───────────────────────── botões ───────────────────────── */
.btn {
	display: inline-flex; align-items: center; justify-content: center; gap: 8px;
	height: 36px; padding: 0 14px;
	border-radius: var(--r-m);
	font-weight: 500; font-size: 14px;
	white-space: nowrap;
	transition: background-color 0.18s var(--ease), box-shadow 0.18s var(--ease), color 0.18s;
}
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary kbd { background: rgba(247, 241, 230, 0.12); color: rgba(247, 241, 230, 0.75); box-shadow: none; }
.tema-escuro .btn-primary kbd { background: rgba(17, 38, 26, 0.08); color: rgba(17, 38, 26, 0.6); }
.btn-soft { background: var(--raise); box-shadow: var(--sh-card); color: var(--ink); }
.tema-escuro .btn-soft { background: rgba(247, 241, 230, 0.05); }
.btn-soft:hover { background: var(--tile); }
.tema-escuro .btn-soft:hover { background: rgba(247, 241, 230, 0.09); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--hover); color: var(--ink); }
.btn-lg { height: 44px; padding: 0 20px; border-radius: var(--r-m); font-size: 15px; }
.icon-btn {
	display: inline-grid; place-items: center;
	width: 32px; height: 32px; border-radius: var(--r-m); color: var(--ink-2);
	transition: background-color 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }

/* ───────────────────────── layout ───────────────────────── */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100vh; height: 100dvh; transition: grid-template-columns 0.3s var(--ease); }
.side { display: flex; flex-direction: column; padding: 14px 10px 14px 14px; min-height: 0; min-width: 0; }
.panel {
	position: relative;
	margin: 10px 10px 10px 0;
	background: var(--panel);
	border-radius: var(--r-l);
	box-shadow: var(--sh-panel);
	overflow: hidden;
	min-width: 0;
	transition: background-color 0.35s var(--ease);
}
.scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.scroll::-webkit-scrollbar { width: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid var(--panel); }
.view { padding: 36px 48px 64px; max-width: 1120px; margin: 0 auto; min-height: 100%; }
.view.enter { animation: viewIn 0.36s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(4px); } }

/* sidebar */
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0 0 8px; height: 36px; margin-bottom: 14px; }
.side-top .icon-btn { color: var(--ink-3); }
.lang {
	display: flex; align-items: center; gap: 10px;
	width: 100%; padding: 5px 8px 5px 5px; border-radius: var(--r-m);
	text-align: left; transition: background-color 0.15s;
}
.lang:hover, .lang[aria-expanded="true"] { background: var(--hover); }
.code { width: 28px; height: 28px; border-radius: var(--r-s); flex: none; display: grid; place-items: center; font: 600 11px/1 var(--f-head); letter-spacing: 0.04em; color: var(--ink-2); background: var(--tile); box-shadow: inset 0 0 0 1px var(--line-2); }
.lang .t { flex: 1; min-width: 0; line-height: 1.2; }
.lang .t b { display: block; font: 600 14px/1.25 var(--f-head); }
.lang .t span { font-size: 12px; color: var(--ink-3); }
.lang .ic { color: var(--ink-3); }
.lang-wrap { position: relative; }
.menu {
	position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: 268px; max-height: min(460px, 70vh); overflow-y: auto;
	background: var(--raise); border-radius: var(--r-l); padding: 6px; box-shadow: var(--sh-pop);
	opacity: 0; transform: translateY(-4px); transform-origin: top left; pointer-events: none;
	transition: opacity 0.16s var(--ease), transform 0.2s var(--ease);
}
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: var(--r-m); text-align: left; }
.menu .mi:hover { background: var(--hover); }
.menu .mi .t { flex: 1; line-height: 1.25; }
.menu .mi .t b { font-weight: 500; display: block; }
.menu .mi .t span { font-size: 12px; color: var(--ink-3); }
.menu .mi > .ic { color: var(--accent-ink); opacity: 0; }
.menu .mi[aria-checked="true"] > .ic { opacity: 1; }
.menu .mi.addable > .ic, .menu .mi.add > .ic { opacity: 0.55; color: var(--ink-3); }
.menu .mi.add .code { background: none; }
.menu .mhd { display: flex; align-items: center; gap: 4px; padding: 6px 10px 6px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.menu .mhd b { font-weight: 500; }
.menu .mhd .mback { width: 26px; height: 26px; margin: -4px 0 -4px -6px; }
.ic.flip { transform: rotate(180deg); }
.menu .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu .note { font-size: 12px; color: var(--ink-3); padding: 4px 10px 6px; }

.save-btn { margin: 12px 0 18px; width: 100%; justify-content: flex-start; padding: 0 8px 0 11px; height: 36px; }
.save-btn .ic { margin-right: 1px; }
.save-btn kbd { margin-left: auto; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
	position: relative;
	display: flex; align-items: center; gap: 11px;
	height: 34px; padding: 0 10px; border-radius: var(--r-m);
	color: var(--ink-2); font-weight: 500; white-space: nowrap;
	transition: background-color 0.15s, color 0.15s;
}
.nav-item:hover { background: var(--hover); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--nav-active); color: var(--accent-ink); box-shadow: var(--sh-card); }
.nav-item .ic { opacity: 0.9; }
.nav-item .count {
	margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 4px;
	display: grid; place-items: center;
	font: 600 11.5px/1 var(--f-body); font-variant-numeric: tabular-nums; color: var(--terra-ink); background: var(--terra-soft);
}
.nav-item .meta { margin-left: auto; font: 500 12px/1 var(--f-body); color: var(--ink-3); }
.nav-label { font-size: 11.5px; font-weight: 500; color: var(--ink-3); padding: 18px 10px 6px; white-space: nowrap; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.seal {
	display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
	margin-left: 10px; padding: 2px 8px 2px 7px; border-radius: 4px;
	font-size: 11.5px; font-weight: 500; color: var(--ink-3); white-space: nowrap;
	box-shadow: inset 0 0 0 1px var(--line-2);
}
.seal::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); opacity: 0.7; }
.me { display: flex; align-items: center; gap: 4px; }
.me .nav-item { flex: 1; min-width: 0; }
.avatar {
	width: 24px; height: 24px; border-radius: 50%; flex: none;
	display: grid; place-items: center;
	font: 600 11px/1 var(--f-head); color: var(--verde); background: var(--verde-claro);
}
.theme-btn .i-sun { display: none; }
.tema-escuro .theme-btn .i-sun { display: block; }
.tema-escuro .theme-btn .i-moon { display: none; }

/* sidebar recolhida */
.app.mini { grid-template-columns: 64px minmax(0, 1fr); }
.mini .side { padding: 14px 8px 14px 10px; align-items: stretch; }
.mini .side-top { flex-direction: column; height: auto; gap: 12px; padding: 6px 0 0; }
.mini .brand .wordmark, .mini .lang .t, .mini .lang > .ic, .mini .lb, .mini .save-btn kbd, .mini .nav-item .meta, .mini .seal { display: none; }
.mini .lang { justify-content: center; padding: 5px; }
.mini .save-btn { padding: 0; justify-content: center; }
.mini .save-btn .ic { margin: 0; }
.mini .nav-item { justify-content: center; padding: 0; }
.mini .nav-item .count { position: absolute; top: -2px; right: -1px; box-shadow: 0 0 0 2px var(--page); background: linear-gradient(var(--terra-soft), var(--terra-soft)), var(--page); min-width: 16px; height: 15px; padding: 0 4px; font-size: 10px; }
.mini .nav-label { font-size: 0; padding: 0; height: 1px; background: var(--line); margin: 14px 8px; }
.mini .me { flex-direction: column; }
.mini .me .nav-item { width: 100%; flex: none; }
.mini .side-top .icon-btn .ic { transform: rotate(180deg); }

/* mobile chrome */
.mtop, .tabbar { display: none; }

/* ───────────────────────── progresso ───────────────────────── */
.bar { display: block; width: 100%; min-width: 0; height: 3px; border-radius: 2px; background: var(--prog-track); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--prog); border-radius: inherit; transition: width 0.5s var(--ease); }

/* ───────────────────────── cabeçalho de página ───────────────────────── */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.ph h1 { margin: 0; font: 600 28px/1.2 var(--f-head); letter-spacing: -0.02em; }
.ph p { margin: 6px 0 0; color: var(--ink-2); }
.eyebrow { font-size: 12.5px; font-weight: 500; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.eyebrow.due { color: var(--terra-ink); }
.dot-terra { width: 6px; height: 6px; border-radius: 50%; background: var(--terra-ink); flex: none; }

/* ───────────────────────── Início · foco ───────────────────────── */
.h1-wrap { min-height: calc(100vh - 20px - 100px); display: flex; flex-direction: column; }
.h1-top { display: flex; justify-content: space-between; align-items: center; color: var(--ink-3); font-size: 13px; }
.h1-hero { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; align-items: center; gap: 56px; padding: 40px 0; }
.h1-hero .big { margin: 16px 0 0; font: 600 clamp(48px, 5.8vw, 76px)/1.02 var(--f-head); letter-spacing: -0.04em; }
.h1-hero .big .n { letter-spacing: -0.02em; }
.h1-hero .sub { margin: 22px 0 32px; font-size: 16px; color: var(--ink-2); max-width: 440px; }
.h1-cta { display: flex; align-items: center; gap: 16px; }
.h1-cta .hint { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.fan { position: relative; height: 260px; }
.fan .fc {
	position: absolute; left: 50%; top: 50%; width: 240px; height: 150px; margin: -75px 0 0 -120px;
	background: var(--raise); border-radius: var(--r-l); box-shadow: var(--sh-lift);
	padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between;
	transition: transform 0.5s var(--ease);
}
.tema-escuro .fan .fc { background: #1a3626; }
.fan .fc b { font: 600 24px/1.1 var(--f-head); letter-spacing: -0.02em; }
.fan .fc .src { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.fan .fc .ipa { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
.fan .fc:nth-child(1) { transform: translateY(-24px) scale(0.9); box-shadow: var(--sh-card); }
.fan .fc:nth-child(2) { transform: translateY(-12px) scale(0.95); box-shadow: var(--sh-card); }
.fan .fc:nth-child(-n + 2)::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--panel); opacity: 0.45; }
.fan:hover .fc:nth-child(1) { transform: translateY(-32px) scale(0.9); }
.fan:hover .fc:nth-child(2) { transform: translateY(-16px) scale(0.95); }
.h1-foot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 18px; }
.quiet { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-m); text-align: left; transition: background-color 0.15s; min-width: 0; }
.quiet:hover { background: var(--hover); }
.qi { width: 32px; height: 32px; border-radius: var(--r-m); display: grid; place-items: center; background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); flex: none; }
.quiet .qt { min-width: 0; line-height: 1.35; }
.quiet .qt b { display: block; font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quiet .qt span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* ───────────────────────── blocos ───────────────────────── */
.tile {
	background: var(--tile); border-radius: var(--r-l); padding: 22px 24px;
	box-shadow: inset 0 0 0 1px var(--line);
	display: flex; flex-direction: column; min-width: 0;
}
.tema-claro .tile.lift { background: var(--raise); box-shadow: var(--sh-card); }
.tile-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.tile-h h2 { margin: 0; font: 500 13px/1.3 var(--f-body); color: var(--ink-3); letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
.tile-h h2 .ic { color: var(--ink-3); }
.media { display: flex; gap: 16px; align-items: center; }
.art {
	width: 76px; height: 76px; border-radius: var(--r-m); flex: none; position: relative; overflow: hidden;
	background: var(--art-1);
	display: grid; place-items: center; color: var(--ink-3);
}
.art svg.ic { width: 24px; height: 24px; stroke-width: 1.4; position: relative; z-index: 1; }
.media .mt { min-width: 0; flex: 1; }
.media .mt b { display: block; font: 600 18px/1.25 var(--f-head); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.media .mt span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.prog-line { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.prog-line .bar { flex: 1; }
.src-ic { width: 28px; height: 28px; border-radius: var(--r-s); display: grid; place-items: center; color: var(--ink-3); flex: none; }
.src-ic .ic { width: 15px; height: 15px; }

/* ───────────────────────── Minhas palavras ───────────────────────── */
.tools { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-m); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { height: 30px; padding: 0 12px; border-radius: var(--r-s); font-size: 13.5px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; transition: background-color 0.18s, color 0.18s, box-shadow 0.2s; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: var(--sh-card); }
.tema-escuro .seg button[aria-pressed="true"] { background: rgba(247, 241, 230, 0.09); box-shadow: none; }
.seg .c { font: 500 12px/1 var(--f-body); font-variant-numeric: tabular-nums; color: var(--ink-3); }
.seg button[data-f="hoje"] .c { color: var(--terra-ink); }
.search { position: relative; width: 280px; }
.search .ic { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--ink-3); pointer-events: none; }
.search input {
	width: 100%; height: 36px; padding: 0 40px 0 36px; border: 0; border-radius: var(--r-m); outline: none;
	background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 0.18s, background-color 0.18s;
}
.search input::placeholder { color: var(--ink-3); }
.search input:focus { background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2), 0 0 0 3px var(--ring); }
.search kbd { position: absolute; right: 9px; top: 50%; translate: 0 -50%; }
.list { display: flex; flex-direction: column; margin: 0 -14px; }
.wrow {
	display: grid; grid-template-columns: minmax(170px, 1fr) minmax(0, 2.1fr) 28px 44px 84px;
	align-items: center; gap: 22px; padding: 13px 16px; border-radius: var(--r-m); text-align: left; width: 100%;
	position: relative; transition: background-color 0.15s;
}
.wrow + .wrow::before { content: ""; position: absolute; left: 16px; right: 16px; top: 0; height: 1px; background: var(--line); transition: opacity 0.15s; }
.wrow:hover, .wrow.sel { background: var(--hover); }
.wrow.sel { background: var(--sel); }
.wrow:hover::before, .wrow:hover + .wrow::before, .wrow.sel::before, .wrow.sel + .wrow::before { opacity: 0; }
.wrow .w b { font: 600 16px/1.3 var(--f-head); display: block; letter-spacing: -0.01em; }
.wrow .w span { font-size: 13px; color: var(--ink-3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrow .ctx { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.str { display: inline-flex; gap: 3px; align-items: flex-end; height: 12px; }
.str i { width: 4px; height: 12px; border-radius: 1px; background: var(--prog-track); }
.str i.on { background: var(--prog); }
.next { font-size: 13px; color: var(--ink-3); text-align: right; white-space: nowrap; display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
.next.hoje { color: var(--terra-ink); font-weight: 500; }
.list-foot { margin-top: 22px; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 18px; align-items: center; }
.legend { display: inline-flex; align-items: center; gap: 6px; }

/* vazio */
.empty { display: grid; place-items: center; text-align: center; padding: 64px 24px 48px; }
.empty h2 { margin: 0; font: 600 26px/1.2 var(--f-head); letter-spacing: -0.02em; }
.empty p { margin: 10px auto 26px; color: var(--ink-2); max-width: 380px; }
.empty .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.how { display: grid; grid-template-columns: repeat(3, 180px); gap: 12px; justify-content: center; margin-top: 52px; padding-top: 28px; border-top: 1px solid var(--line); }
.how > div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12.5px; color: var(--ink-3); }
.how b { color: var(--ink); font-weight: 500; font-size: 13.5px; margin-top: 10px; }
.no-res { text-align: center; padding: 56px 0; color: var(--ink-3); }
.no-res b { display: block; color: var(--ink); font: 600 17px var(--f-head); margin-bottom: 4px; }

/* painel lateral */
.drawer-scrim { position: absolute; inset: 0; z-index: 20; background: transparent; pointer-events: none; transition: background-color 0.25s; }
.drawer-scrim.open { pointer-events: auto; }
.drawer {
	position: absolute; z-index: 21; top: 8px; right: 8px; bottom: 8px; width: 420px;
	background: var(--raise); border-radius: var(--r-l); box-shadow: var(--sh-pop);
	display: flex; flex-direction: column; overflow: hidden;
	transform: translateX(calc(100% + 24px)); transition: transform 0.4s var(--ease);
}
.tema-escuro .drawer { background: #183223; }
.drawer.open { transform: none; }
.drawer:focus { outline: none; }
.proto { transition: opacity 0.2s; }
body.has-drawer .proto { opacity: 0; pointer-events: none; }
.dr-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 0 16px; }
.dr-body { flex: 1; overflow-y: auto; padding: 14px 28px 28px; }
.dr-word { font: 600 40px/1.1 var(--f-head); letter-spacing: -0.03em; margin: 8px 0 0; }
.dr-ipa { display: flex; align-items: center; gap: 12px; margin-top: 10px; color: var(--ink-3); font-size: 15px; }
.listen { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px 0 9px; border-radius: var(--r-s); font-size: 13px; font-weight: 500; color: var(--accent-ink); background: var(--sel); transition: background-color 0.15s; }
.listen:hover { background: var(--press); }
.listen.on .ic { animation: pulse 0.9s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.dr-tr { font-size: 18px; margin-top: 16px; color: var(--ink); }
.dr-sec { margin-top: 30px; }
.dr-sec h3 { margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
.quote { padding: 14px 16px; border-radius: var(--r-m); background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); }
.quote + .quote { margin-top: 8px; }
.quote p { margin: 0; font-size: 14.5px; line-height: 1.55; }
.quote .pt { color: var(--ink-3); font-size: 13px; margin-top: 6px; }
.quote .qs { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.next-box { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: var(--r-m); background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); }
.next-box b { font: 600 17px/1.2 var(--f-head); display: block; }
.next-box b.hoje { color: var(--terra-ink); }
.next-box span { font-size: 12.5px; color: var(--ink-3); }
.next-box .str-l { text-align: right; }
.next-box .str-l .str { margin-bottom: 4px; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; padding: 8px 2px; font-size: 13.5px; }
.hist li + li { border-top: 1px solid var(--line); }
.hist time { color: var(--ink-3); font-size: 12.5px; }
.grade { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.grade::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--g, var(--salvia)); }
.grade[data-g="1"] { --g: var(--line-2); }
.grade[data-g="2"] { --g: rgba(138, 163, 146, 0.5); }
.grade[data-g="3"] { --g: var(--salvia); }
.grade[data-g="4"] { --g: var(--g4); }
.hist .iv { color: var(--ink-3); font-size: 12.5px; }
.dr-foot { padding: 14px 20px; display: flex; gap: 8px; border-top: 1px solid var(--line); }
.dr-foot .btn-primary { flex: 1; }

/* ───────────────────────── Revisar ───────────────────────── */
.rv { display: flex; flex-direction: column; min-height: calc(100vh - 20px - 100px); }
.rv-top { display: grid; grid-template-columns: 1fr minmax(0, 520px) 1fr; align-items: center; gap: 24px; }
.rv-top .l { font: 500 14px var(--f-body); color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.rv-top .r { display: flex; justify-content: flex-end; align-items: center; gap: 10px; font: 500 13px var(--f-body); font-variant-numeric: tabular-nums; color: var(--ink-3); }
.rv-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 0 12px; }
.card3d { width: min(580px, 100%); height: 340px; perspective: 1600px; }
.card3d.leave { animation: cardOut 0.22s var(--ease-in) both; }
.card3d.enter { animation: cardIn 0.4s var(--ease) both; }
@keyframes cardOut { to { opacity: 0; transform: translateX(-20px); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } }
.card-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.65s var(--ease); }
.flipped .card-in { transform: rotateY(180deg); }
.face {
	position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
	background: var(--raise); border-radius: var(--r-l); box-shadow: var(--sh-lift);
	padding: 20px 26px 26px; display: flex; flex-direction: column;
}
.tema-escuro .face { background: #1a3626; }
.face.back { transform: rotateY(180deg); }
.face .fh { display: flex; align-items: center; justify-content: space-between; }
.face .src { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); }
.face .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.face .word { font: 600 56px/1.05 var(--f-head); letter-spacing: -0.035em; }
.face .ipa { margin-top: 10px; color: var(--ink-3); font: 400 15px var(--f-body); }
.face .ctx-pt, .empty p, .done p, .ph p, .h1-hero .sub { text-wrap: pretty; }
.face .ctx { text-wrap: balance; }
.face .ctx { text-align: center; font-size: 15.5px; line-height: 1.55; color: var(--ink-2); max-width: 460px; margin: 0 auto; }
.face .ctx u { text-decoration: none; color: var(--ink); font-weight: 500; box-shadow: inset 0 -1.5px 0 var(--line-2); }
.face.back .small-w { font: 400 14px var(--f-body); color: var(--ink-3); }
.face.back .small-w b { font: 600 15px var(--f-head); color: var(--ink-2); }
.face.back .tr { font: 600 38px/1.15 var(--f-head); letter-spacing: -0.03em; margin-top: 8px; }
.face.back .ctx-pt { text-align: center; color: var(--ink-3); font-size: 13.5px; margin-top: 6px; }
.rv-acts { margin-top: 28px; height: 80px; display: grid; place-items: start center; width: min(580px, 100%); }
.rv-acts .show { width: 280px; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; animation: viewIn 0.3s var(--ease) both; }
.gbtn {
	position: relative; height: 64px; border-radius: var(--r-m); background: var(--raise); box-shadow: var(--sh-card);
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
	transition: box-shadow 0.18s, background-color 0.18s;
}
.tema-escuro .gbtn { background: rgba(247, 241, 230, 0.05); }
.gbtn:hover { background: var(--tile); }
.tema-escuro .gbtn:hover { background: rgba(247, 241, 230, 0.09); }
.gbtn:active, .gbtn.hit { background: var(--sel); }
.gbtn b { font: 500 15px/1.2 var(--f-body); }
.gbtn span { font-size: 12.5px; color: var(--ink-3); }
.gbtn kbd { position: absolute; top: 7px; right: 7px; min-width: 18px; height: 18px; font-size: 10.5px; }
.rv-hint { text-align: center; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 16px; justify-content: center; align-items: center; }
.rv-hint span { display: inline-flex; gap: 6px; align-items: center; }
.done { flex: 1; display: grid; place-items: center; text-align: center; padding: 30px 0; animation: viewIn 0.5s var(--ease) both; }
.done .eyebrow { justify-content: center; margin-bottom: 14px; }
.done h2 { margin: 0; font: 600 44px/1.1 var(--f-head); letter-spacing: -0.035em; }
.done p { color: var(--ink-2); margin: 12px 0 36px; font-size: 16px; }
.done .sum { display: inline-grid; grid-template-columns: repeat(4, 112px); margin-bottom: 30px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.done .sum div { padding: 18px 10px 16px; }
.done .sum div + div { box-shadow: inset 1px 0 0 var(--line); }
.done .sum b { display: block; font: 600 30px/1 var(--f-head); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.done .sum span { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; }
.done .sum span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--g); }
.done .tomorrow { font-size: 13px; color: var(--ink-3); margin-bottom: 24px; }

/* ───────────────────────── Música / Integrações / Perfil ───────────────────────── */
.songs { display: flex; flex-direction: column; margin: 0 -14px; }
.song { display: grid; grid-template-columns: 48px minmax(0, 1fr) 200px auto; gap: 18px; align-items: center; padding: 12px 14px; border-radius: var(--r-m); transition: background-color 0.15s; }
.song:hover { background: var(--hover); }
.song .art { width: 48px; height: 48px; border-radius: var(--r-m); }
.song .art svg.ic { width: 18px; height: 18px; }
.song b { font: 600 15.5px/1.3 var(--f-head); letter-spacing: -0.01em; display: block; }
.song span { font-size: 13px; color: var(--ink-3); }
.song .p { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--salvia); }
.token { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 5px 5px 5px 12px; border-radius: var(--r-m); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); font: 500 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-2); }
.token span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 16px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 12px; font-size: 13.5px; color: var(--ink-2); }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--f-head); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
.steps b { color: var(--ink); font-weight: 500; display: block; }
.intg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ig { padding: 22px; }
.ig-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.ig-logo { width: 40px; height: 40px; border-radius: var(--r-m); display: grid; place-items: center; background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.ig-logo.tv { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.ig-t { font: 600 18px/1.25 var(--f-head); letter-spacing: -0.01em; display: block; }
.ig-s { font-size: 13px; color: var(--ink-3); }
.ig p { margin: 12px 0 0; color: var(--ink-2); font-size: 13.5px; text-wrap: pretty; }
.ig-stats { display: flex; gap: 16px; margin-top: 16px; font-size: 12.5px; color: var(--ink-3); align-items: baseline; }
.ig-stats b { font: 600 15px var(--f-head); color: var(--ink); margin-right: 2px; }
.ig .token { margin-top: 14px; }
.ig-last { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 9px 12px; border-radius: var(--r-m); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-3); min-width: 0; }
.ig-last span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ig-last b { color: var(--ink); font-weight: 500; }
.ig-f { margin-top: auto; padding-top: 14px; margin-left: -10px; }
.soon-tag { font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 2px 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-2); }
.soon .ig-t { color: var(--ink-2); }
.soon .ig-logo { color: var(--ink-3); }
.how-int { margin-top: 40px; }
.how-int h2 { margin: 0 0 18px; font: 500 13px var(--f-body); color: var(--ink-3); }
.steps.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.settings { max-width: 640px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 4px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row b { font-weight: 500; display: block; }
.set-row span { font-size: 13px; color: var(--ink-3); }
.stepper { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-m); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.stepper button { width: 30px; height: 30px; border-radius: var(--r-s); font-weight: 500; color: var(--ink-2); }
.stepper button:hover { background: var(--raise); }
.stepper output { min-width: 34px; text-align: center; font: 600 15px var(--f-head); font-variant-numeric: tabular-nums; }
.profile-card { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.profile-card .avatar { width: 52px; height: 52px; font-size: 20px; }
.profile-card b { font: 600 20px var(--f-head); letter-spacing: -0.01em; display: block; }

/* ───────────────────────── diálogo Guardar ───────────────────────── */
.modal-scrim {
	position: fixed; inset: 0; z-index: 60; background: var(--scrim);
	opacity: 0; pointer-events: none; transition: opacity 0.22s var(--ease);
	display: flex; justify-content: center; align-items: flex-start; padding: 16vh 16px 16px;
}
.modal-scrim.open { opacity: 1; pointer-events: auto; }
.modal {
	width: min(560px, 100%); background: var(--raise); border-radius: var(--r-l); box-shadow: var(--sh-pop);
	transform: translateY(-6px); transition: transform 0.3s var(--ease); overflow: hidden;
}
.tema-escuro .modal { background: #183223; }
.modal-scrim.open .modal { transform: none; }
.mh { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0 20px; }
.lang-chip { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px 0 3px; border-radius: var(--r-s); background: var(--tile); box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.lang-chip .code { width: 20px; height: 20px; font-size: 9px; border-radius: 4px; box-shadow: none; background: var(--sunk); }
.mb { padding: 10px 20px 4px; }
.f-word { width: 100%; border: 0; outline: none; background: none; font: 600 30px/1.2 var(--f-head); letter-spacing: -0.025em; padding: 8px 0 6px; }
.f-word::placeholder { color: var(--ink-3); opacity: 0.55; }
.field { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.field .ic { margin-top: 3px; color: var(--ink-3); }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); margin-bottom: 2px; }
.field label i { font-style: normal; font-weight: 400; }
.field input, .field textarea { width: 100%; border: 0; outline: none; background: none; padding: 0; resize: none; font-size: 15px; line-height: 1.5; }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-3); opacity: 0.75; }
.mf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 14px 20px; background: var(--tile); border-top: 1px solid var(--line); }
.mf .hint { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.mf .acts { display: flex; gap: 6px; }
.f-err { color: var(--terra-ink); font-size: 12.5px; height: 0; overflow: hidden; transition: height 0.2s; }
.f-err.on { height: 20px; }

/* toast */
.toast {
	position: fixed; z-index: 70; left: 50%; bottom: 28px; translate: -50% 0;
	display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 11px; border-radius: var(--r-m);
	background: #11261a; color: #f3ede1; font-size: 13.5px; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.35);
	opacity: 0; transform: translateY(8px); transition: opacity 0.25s var(--ease), transform 0.35s var(--ease); pointer-events: none;
}
.tema-escuro .toast { background: #f3ede1; color: #11261a; }
.toast.on { opacity: 1; transform: none; }
.toast .ok { width: 18px; height: 18px; display: grid; place-items: center; color: var(--salvia); }
.toast .ok .ic { width: 15px; height: 15px; stroke-width: 2.2; }

/* barra do protótipo (fora do design) */
.proto {
	position: fixed; z-index: 80; right: 16px; bottom: 16px;
	display: flex; align-items: center; gap: 6px; padding: 5px 5px 5px 12px; border-radius: 8px;
	background: rgba(24, 26, 24, 0.82); color: rgba(255, 255, 255, 0.6);
	backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
	font: 500 11.5px/1 var(--f-body);
}
.proto .p-tog { display: none; height: 26px; padding: 0 10px; }
.proto .pg { display: flex; gap: 1px; padding: 2px; border-radius: 6px; background: rgba(255, 255, 255, 0.07); }

@media (max-width: 1180px) {
	.h1-hero { grid-template-columns: minmax(0, 1fr) 250px; gap: 32px; }

}

}

}

		if (S.filter === 'hoje' && x.next !== 'hoje') return false;
		if (S.filter === 'novas' && x.lvl !== 0) return false;
		if (S.filter === 'dominadas' && x.lvl !== 4) return false;
		return !q || x.w.toLowerCase().includes(q) || x.tr.toLowerCase().includes(q);
	});
}
function renderList() {
	const el = $('#list');
	if (!el) return;
	const rows = filtered();
	if (!rows.length) {
		el.innerHTML = `<div class="no-res"><b>Nada por aqui</b>${S.q ? `Nenhuma palavra com “${esc(S.q)}”.` : 'Nenhuma palavra neste filtro.'}</div>`;

	}
	el.innerHTML = rows.map((x) => {
		const c = x.ctx[0];
		return `<button class="wrow${S.sel === x.w ? ' sel' : ''}" data-word="${esc(x.w)}">

			<span class="ctx">${hlText(c[0], c[1])}</span>

		</button>`;

}

function history(x) {
	const rows = {
		0: [],
		1: [['ontem', 1, '10 min'], ['seg, 9 nov', 2, '1 dia']],
		2: [['ontem', 3, '1 dia'], ['dom, 8 nov', 2, '1 dia'], ['sex, 6 nov', 1, '10 min']],
		3: [['qui, 5 nov', 3, '6 dias'], ['sáb, 1 nov', 3, '3 dias'], ['qua, 29 out', 2, '1 dia']],
		4: [['há 9 dias', 4, '21 dias'], ['há 20 dias', 3, '9 dias'], ['há 26 dias', 3, '4 dias'], ['há 28 dias', 4, '2 dias']],
	}[x.lvl];
	if (!rows.length) return `<p class="faint" style="margin:0;font-size:13.5px">Ainda não revisada. Ela entra na revisão de hoje como palavra nova.</p>`;
	return `<ul class="hist">${rows.map(([d, g, iv]) => `<li><time>${d}</time><span class="grade" data-g="${g}">${GRADES[g - 1].label}</span><span class="iv">→ ${iv}</span></li>`).join('')}</ul>`;
}

		counter.textContent = `${q.length} de ${q.length}`;

					<div class="fh"><span class="src">${ic(SRC[c[3]].ic, 'sm')}${esc(c[4])}</span><button class="icon-btn" data-say="${esc(x.w)}" aria-label="Ouvir">${ic('sound', 'sm')}</button></div>
					<div class="mid"><div class="word">${esc(x.w)}</div><div class="ipa">${esc(x.ipa)}</div></div>

				</div>
				<div class="face back" aria-hidden="${!S.rv.flipped}">
					<div class="fh"><span class="src">${ic(SRC[c[3]].ic, 'sm')}${esc(c[4])}</span><button class="icon-btn" data-say="${esc(x.w)}" aria-label="Ouvir">${ic('sound', 'sm')}</button></div>
					<div class="mid"><div class="small-w"><b>${esc(x.w)}</b> · ${esc(x.ipa)}</div><div class="tr">${esc(x.tr)}</div></div>
					<p class="ctx">${hlText(c[0], c[1])}</p>
					<p class="ctx-pt">${esc(c[2])}</p>

			</div>
		</div>

	</div>

function renderActs() {
	const a = $('#rvActs');
	if (!a) return;
	a.innerHTML = S.rv.flipped
		? `<div class="grades">${GRADES.map((g) => `<button class="gbtn" data-grade="${g.k}" style="--g:${g.g}"><b>${g.label}</b><span>${g.iv}</span><kbd>${g.k}</kbd></button>`).join('')}</div>`
		: `<button class="btn btn-primary btn-lg show" data-act="flip">Mostrar resposta<kbd>Espaço</kbd></button>`;
}
function flip() {
	if (S.rv.flipped || S.rv.i >= S.rv.queue.length) return;
	S.rv.flipped = true;
	$('#card')?.classList.add('flipped');
	$$('#card .face').forEach((f) => f.setAttribute('aria-hidden', f.classList.contains('front')));
	renderActs();
}
function grade(k) {
	if (!S.rv.flipped) return;
	const btn = $(`.gbtn[data-grade="${k}"]`);
	btn?.classList.add('hit');
	S.rv.log.push({ w: S.rv.queue[S.rv.i], g: k });
	const card = $('#card');
	card?.classList.add('leave');
	syncCount();
	setTimeout(() => { S.rv.i++; S.rv.flipped = false; renderCard(true); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220);
}
function undo() {
	if (!S.rv.log.length) return;
	S.rv.log.pop();
	S.rv.i = Math.max(0, S.rv.i - 1);
	S.rv.flipped = true;
	syncCount();
	renderCard(true);
	toast('Última avaliação desfeita');
}

/* ───────────────────────── render ───────────────────────── */
function render(anim = true) {
	const view = $('#view');
	view.classList.remove('enter');
	view.innerHTML = V[S.screen]();
	if (anim) { void view.offsetWidth; view.classList.add('enter'); }
	$$('[data-go]').forEach((a) => (a.dataset.go === S.screen ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
	syncCount();
	$$('[data-lang-name]').forEach((e) => (e.textContent = langName()));
	$$('[data-lang-code]').forEach((e) => (e.textContent = curLang().code));
	$$('[data-lang-sub]').forEach((e) => (e.textContent = words().length ? `${words().length} palavras` : 'Nenhuma palavra ainda'));
	$$('[data-theme]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.theme === 'escuro') === isDark())));
	if (S.screen === 'palavras') renderList();
	if (S.screen === 'revisar' && S.rv.queue.length) renderCard(false);
}
function go(screen) {
	if (!V[screen]) screen = 'inicio';
	if (screen === 'revisar' && S.screen !== 'revisar' && S.rv.i >= S.rv.queue.length) startReview();
	if (S.screen !== screen) closeDrawer();
	S.screen = screen;
	$('#scroll').scrollTop = 0;
	window.scrollTo(0, 0);
	render();
}
window.addEventListener('hashchange', () => go(location.hash.slice(1)));

});
$('#fWord').addEventListener('input', () => $('#fErr').classList.remove('on'));
$('#fCtx').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#saveForm').requestSubmit(); } });

/* toast */
let tT;
function toast(msg) {
	$('#toastT').textContent = msg;
	$('#toast').classList.add('on');
	clearTimeout(tT);
	tT = setTimeout(() => $('#toast').classList.remove('on'), 2400);
}

/* fala */
function say(text, btn) {
	if (!('speechSynthesis' in window)) return toast('Seu navegador não tem voz disponível');
	speechSynthesis.cancel();
	const u = new SpeechSynthesisUtterance(text);
	u.lang = curLang()?.voice || 'en-US';
	u.rate = 0.92;
	btn?.classList.add('on');
	u.onend = u.onerror = () => btn?.classList.remove('on');
	speechSynthesis.speak(u);
}

/* ───────────────────────── eventos ───────────────────────── */
document.addEventListener('click', (e) => {
	const t = e.target.closest('button, a, [data-word]');
	if (!e.target.closest('.lang-wrap')) toggleLang(null, null, false);
	if (e.target === $('#modal')) return closeSave();
	if (e.target === $('#scrim')) return closeDrawer();
	if (!t) return;
	if (t.id === 'langBtn') return toggleLang(t, $('#langMenu'));
	if (t.id === 'langBtnM') return toggleLang(t, $('#langMenuM'));
	if (t.dataset.act === 'addLangView' || t.dataset.act === 'langBack') {
		S.langView = t.dataset.act === 'addLangView' ? 'add' : 'list';
		$$('.menu.open').forEach((m) => (m.innerHTML = langMenuHTML()));
		return;
	}
	if (t.dataset.addlang) {
		const l = ALL_LANGS.find((x) => x.k === t.dataset.addlang);
		if (!LANGS.includes(l)) LANGS.push(l);
		setLang(l.k);
		return toast(`${l.name} adicionado aos seus idiomas`);
	}
	if (t.dataset.lang) return setLang(t.dataset.lang);
	if (t.dataset.theme) return setTheme(t.dataset.theme);
	if (t.dataset.f) { S.filter = t.dataset.f; $$('.seg [data-f]').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); return renderList(); }
	if (t.dataset.say) return say(t.dataset.say, t);
	if (t.dataset.grade) return grade(+t.dataset.grade);
	if (t.dataset.word) {
		if (S.screen !== 'palavras') { location.hash = 'palavras'; setTimeout(() => openDrawer(t.dataset.word), 60); }
		else openDrawer(t.dataset.word);
		return;
	}
	const a = t.dataset.act;
	if (a === 'save') return openSave();
	if (a === 'close') return closeSave();
	if (a === 'closeDrawer') return closeDrawer();
	if (a === 'theme') return setTheme(isDark() ? 'claro' : 'escuro');
	if (a === 'mini') return setMini(!$('#app').classList.contains('mini'));
	if (a === 'flip') return flip();
	if (a === 'lang') { e.stopPropagation(); return setLang(S.lang === 'en' ? 'it' : 'en'); }
	if (a === 'openLangAdd') {
		e.stopPropagation();
		const mob = matchMedia('(max-width: 768px)').matches;
		const b = $(mob ? '#langBtnM' : '#langBtn'), m = $(mob ? '#langMenuM' : '#langMenu');
		toggleLang(b, m, true);
		S.langView = 'add';
		m.innerHTML = langMenuHTML();
		return;
	}
	if (a === 'npd') { S.newPerDay = Math.max(0, Math.min(50, S.newPerDay + +t.dataset.d)); $('#npd').textContent = S.newPerDay; return; }
	if (a === 'toast') { e.preventDefault(); return toast(t.dataset.msg); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; renderList(); } });
document.addEventListener('keydown', (e) => {
	const typing = e.target.closest?.('input, textarea, [contenteditable]');
	if (e.key === 'Escape') {
		if ($('#modal').classList.contains('open')) return closeSave();
		if ($('.menu.open')) return toggleLang(null, null, false);
		if (S.sel) return closeDrawer();
		if (typing) return e.target.blur();
	}
	if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
	if ($('#modal').classList.contains('open')) return;
	const k = e.key.toLowerCase();
	if (k === 'n') { e.preventDefault(); return openSave(); }
	if (k === '[') { e.preventDefault(); return setMini(!$('#app').classList.contains('mini')); }
	if (k === '/' && S.screen === 'palavras') { e.preventDefault(); return $('#q')?.focus(); }
	if (S.screen === 'revisar') {
		if (e.key === ' ' || e.key === 'Enter') { if (!S.rv.flipped) { e.preventDefault(); flip(); } return; }
		if ('1234'.includes(e.key)) return grade(+e.key);
		if (k === 'z') return undo();
	} else if (k === 'r' && S.screen === 'inicio') { location.hash = 'revisar'; }
});

/* gancho para os prints */
document.querySelector('.proto .p-tog').addEventListener('click', (e) => {
	const pr = e.currentTarget.parentElement;
	pr.classList.add('open');
	e.currentTarget.setAttribute('aria-expanded', 'true');
	e.stopPropagation();
});
document.addEventListener('click', (e) => { const pr = document.querySelector('.proto'); if (!pr.contains(e.target)) pr.classList.remove('open'); });
window.proto = { go: (s) => (location.hash = s), setTheme, setLang, setMini, openDrawer, openSave, flip, grade, render, S };

/* início */
const p = new URLSearchParams(location.search);
if (p.get('tema') === 'escuro') setTheme('escuro');
if (p.get('barra') === 'recolhida') setMini(true);
S.screen = V[location.hash.slice(1)] ? location.hash.slice(1) : 'inicio';
render(false);
</script>
